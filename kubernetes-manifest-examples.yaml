# Kubernetes Manifest Examples
# ============================
# This file demonstrates the three core Kubernetes resources needed to
# deploy a Spring Boot microservice and expose it to the internet:
#
#   1. Deployment  — manages the pods (instances) of your application
#   2. Service     — provides a stable network endpoint to reach the pods
#   3. Ingress     — routes external HTTP traffic to the right service
#
# Apply all resources with: kubectl apply -f kubernetes-manifest-examples.yaml
# Delete all resources with: kubectl delete -f kubernetes-manifest-examples.yaml

---
# ─────────────────────────────────────────────────────────────────────────────
# 1. NAMESPACE
#    Logical grouping for all resources belonging to this application.
#    Provides isolation — resource names only need to be unique within a namespace.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: modern-web-app
  labels:
    environment: production
    team: platform

---
# ─────────────────────────────────────────────────────────────────────────────
# 2. SECRET
#    Stores sensitive data (connection strings, API keys, JWT signing keys).
#    In production, use Azure Key Vault + Secret Store CSI Driver instead of
#    hardcoding values here.
#
#    Values must be base64-encoded:
#    echo -n "mypassword" | base64
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: product-service-secrets
  namespace: modern-web-app
type: Opaque
data:
  # These are example base64-encoded placeholder values
  # In production: use Azure Key Vault + CSI driver, never hardcode real secrets
  db-username: cHJvZHVjdHVzZXI=         # "productuser"
  db-password: UGwkYXNlQ2hhbmdlTWUh     # "Pl$aseChangeMe!"
  jwt-secret: c2VjcmV0a2V5Zm9yandk      # "secretkeyforjwt"

---
# ─────────────────────────────────────────────────────────────────────────────
# 3. CONFIGMAP
#    Stores non-sensitive configuration as key-value pairs.
#    Keeps configuration separate from container images — change config without
#    rebuilding the image.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: product-service-config
  namespace: modern-web-app
data:
  # Spring Boot application properties passed as environment variables
  SPRING_PROFILES_ACTIVE: "production"
  SERVER_PORT: "8080"
  LOGGING_LEVEL_ROOT: "INFO"
  SPRING_DATASOURCE_URL: "jdbc:sqlserver://myapp-sql.database.windows.net:1433;database=products;encrypt=true"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "when_authorized"

---
# ─────────────────────────────────────────────────────────────────────────────
# 4. DEPLOYMENT — product-service
#
#    A Deployment manages a ReplicaSet, which manages the Pods.
#    It ensures:
#      • The desired number of pod replicas are always running
#      • Rolling updates are performed with zero downtime
#      • Failed pods are automatically replaced
#
#    Key fields:
#      spec.replicas           — how many pod instances to run
#      spec.selector           — which pods this deployment manages (by label)
#      spec.template           — the pod blueprint (labels, containers, volumes)
#      spec.strategy           — how to update pods (RollingUpdate vs Recreate)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: modern-web-app
  labels:
    app: product-service
    version: "1.2.0"
    component: backend
  annotations:
    deployment.kubernetes.io/revision: "1"
    description: "Spring Boot microservice for product management"
spec:
  # ── Scaling ──────────────────────────────────────────────────────────────
  replicas: 3    # Run 3 identical pod instances for high availability

  # ── Pod Selection ─────────────────────────────────────────────────────────
  # The deployment manages pods that have these labels.
  # This selector MUST match the labels in spec.template.metadata.labels.
  selector:
    matchLabels:
      app: product-service

  # ── Update Strategy ───────────────────────────────────────────────────────
  # RollingUpdate replaces pods gradually:
  #   maxSurge: 1       → allow 1 extra pod above desired count during update
  #   maxUnavailable: 0 → never take a pod down before a new one is ready
  # This guarantees zero downtime during deployments.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  # ── Pod Template ──────────────────────────────────────────────────────────
  # This is the blueprint for every pod the deployment creates.
  template:
    metadata:
      labels:
        app: product-service      # ← Must match spec.selector.matchLabels
        version: "1.2.0"
        component: backend
      annotations:
        # Prometheus metrics scraping configuration
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"

    spec:
      # ── Service Account ─────────────────────────────────────────────────
      # Use a dedicated service account (not the default) to limit permissions.
      serviceAccountName: product-service-sa

      # ── Pod-level Security ──────────────────────────────────────────────
      securityContext:
        runAsNonRoot: true       # Don't run as root inside the container
        runAsUser: 1000
        fsGroup: 1000

      # ── Containers ──────────────────────────────────────────────────────
      containers:
        - name: product-service
          # Image from Azure Container Registry (ACR)
          image: myapp.azurecr.io/product-service:1.2.0
          imagePullPolicy: IfNotPresent    # Use cached image if same tag exists

          # Port the Spring Boot app listens on
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # ── Environment Variables ──────────────────────────────────────
          # Inject configuration from ConfigMap and Secrets.
          # Applications read these as standard environment variables.
          env:
            # From ConfigMap (non-sensitive config)
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: product-service-config
                  key: SPRING_PROFILES_ACTIVE

            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: product-service-config
                  key: SERVER_PORT

            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: product-service-config
                  key: SPRING_DATASOURCE_URL

            # From Secret (sensitive config — base64-decoded at runtime)
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: product-service-secrets
                  key: db-username

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: product-service-secrets
                  key: db-password

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: product-service-secrets
                  key: jwt-secret

          # ── Resource Requests and Limits ────────────────────────────────
          # requests: minimum resources the pod needs (used for scheduling)
          # limits:   maximum resources the pod can use (prevents noisy neighbors)
          resources:
            requests:
              memory: "256Mi"   # Scheduler only places pod on nodes with 256MB free
              cpu: "250m"       # 250 millicores = 0.25 CPU cores
            limits:
              memory: "512Mi"   # Pod is killed (OOMKilled) if it exceeds this
              cpu: "500m"       # Pod is throttled (not killed) if it exceeds this

          # ── Readiness Probe ──────────────────────────────────────────────
          # Kubernetes only sends traffic to a pod when the readiness probe passes.
          # Pod is removed from Service endpoints (no traffic) when it fails.
          # Use this to prevent traffic reaching a pod that hasn't finished starting.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30   # Wait 30s before first check (JVM startup time)
            periodSeconds: 10         # Check every 10 seconds
            failureThreshold: 3       # Mark unready after 3 consecutive failures
            successThreshold: 1       # Mark ready after 1 success

          # ── Liveness Probe ───────────────────────────────────────────────
          # If this probe fails, Kubernetes restarts the container.
          # Use this to detect deadlocks or hung states the app cannot recover from.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60   # Give more time before liveness checks start
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5

          # ── Container-level Security ─────────────────────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL     # Drop all Linux capabilities

          # ── Volume Mounts ────────────────────────────────────────────────
          volumeMounts:
            - name: tmp-dir          # Spring Boot needs /tmp for temporary files
              mountPath: /tmp
            - name: log-dir
              mountPath: /app/logs

      # ── Volumes ──────────────────────────────────────────────────────────
      volumes:
        - name: tmp-dir
          emptyDir: {}     # Empty directory, deleted when pod is deleted
        - name: log-dir
          emptyDir: {}

      # ── Pod Scheduling ────────────────────────────────────────────────────
      # Prefer to spread pods across different nodes (anti-affinity).
      # If a node fails, only 1 pod is lost, not all 3.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: product-service
                topologyKey: kubernetes.io/hostname   # Spread across different hosts

      # ── Graceful Shutdown ─────────────────────────────────────────────────
      # Give pods 30 seconds to finish in-flight requests before terminating.
      terminationGracePeriodSeconds: 30

---
# ─────────────────────────────────────────────────────────────────────────────
# 5. SERVICE — product-service
#
#    A Service gives the Deployment a stable DNS name and IP address.
#    Without a Service, you'd need to know each Pod's IP (which changes constantly).
#
#    ClusterIP type means:
#      • Accessible only from within the cluster
#      • Other services call it by DNS name: http://product-service.modern-web-app.svc.cluster.local
#      • Or by short name within the same namespace: http://product-service
#
#    The Service load-balances across all healthy, ready pods matching the selector.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: modern-web-app
  labels:
    app: product-service
    component: backend
  annotations:
    # Document the service for other teams
    description: "Internal service endpoint for the product microservice"
spec:
  # ClusterIP: only reachable within the cluster (not from the internet).
  # Traffic from the internet reaches pods via the Ingress (see below).
  type: ClusterIP

  # Route traffic to pods with this label.
  # MUST match the pod labels defined in the Deployment's template.
  selector:
    app: product-service

  # Port mapping: Service port 80 → container port 8080
  ports:
    - name: http
      protocol: TCP
      port: 80            # The port other services call (e.g., http://product-service:80)
      targetPort: http    # The named port on the container (containerPort: 8080)

  # sessionAffinity: None means each request may go to a different pod (default).
  # Use "ClientIP" to always route the same client to the same pod (sticky sessions).
  sessionAffinity: None

---
# ─────────────────────────────────────────────────────────────────────────────
# 6. INGRESS — main application ingress
#
#    An Ingress exposes HTTP/HTTPS routes from outside the cluster to services.
#    The Ingress Controller (e.g., nginx, AGIC) reads these rules and configures
#    itself to route traffic accordingly.
#
#    This example shows:
#      • TLS/HTTPS termination (certificate from a Secret)
#      • Path-based routing (different paths → different services)
#      • Host-based routing (traffic for a specific hostname)
#      • Rewrite rules (strip /api prefix before forwarding)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: modern-web-app-ingress
  namespace: modern-web-app
  labels:
    app: modern-web-app
  annotations:
    # ── Ingress Controller ──────────────────────────────────────────────────
    # Tell Kubernetes which Ingress Controller should process this resource.
    # For AGIC (Azure Application Gateway): kubernetes.io/ingress.class: azure/application-gateway
    # For nginx: kubernetes.io/ingress.class: nginx
    kubernetes.io/ingress.class: "nginx"

    # ── SSL/TLS ─────────────────────────────────────────────────────────────
    # Automatically obtain and renew Let's Encrypt certificates via cert-manager
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # ── NGINX-specific annotations ──────────────────────────────────────────
    # Increase timeout for long-running requests (e.g., file uploads)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"

    # Limit upload size to 10MB
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

    # Enable CORS at the ingress level
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://myapp.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"

    # Force HTTPS redirect
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

    # Rewrite: strip the /api prefix before forwarding to the backend service
    # e.g., /api/products → /products (if your service doesn't expect /api prefix)
    # nginx.ingress.kubernetes.io/rewrite-target: /$2

spec:
  # ── TLS Configuration ──────────────────────────────────────────────────────
  # Specifies which hostnames use HTTPS and where the certificate is stored.
  # cert-manager (if installed) will automatically provision and renew the cert.
  tls:
    - hosts:
        - myapp.com
        - www.myapp.com
      secretName: myapp-tls-certificate   # cert-manager stores the cert here

  # ── Routing Rules ──────────────────────────────────────────────────────────
  # Rules are evaluated in order. More specific paths are matched first.
  rules:
    - host: myapp.com     # Only match requests for this hostname
      http:
        paths:
          # ── React Frontend ────────────────────────────────────────────────
          # The root path serves the React SPA (Single Page Application).
          # All unmatched paths also serve the React app (client-side routing).
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service    # Service serving the React static files
                port:
                  number: 80

          # ── REST API — Product Service ────────────────────────────────────
          - path: /api/products
            pathType: Prefix
            backend:
              service:
                name: product-service
                port:
                  number: 80

          # ── REST API — Order Service ──────────────────────────────────────
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 80

          # ── REST API — User / Auth Service ────────────────────────────────
          - path: /api/users
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 80

          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: user-service    # Auth endpoints are part of user-service
                port:
                  number: 80

---
# ─────────────────────────────────────────────────────────────────────────────
# 7. HORIZONTAL POD AUTOSCALER (HPA)
#
#    Automatically scales the number of pod replicas based on CPU/memory usage.
#    When traffic spikes, Kubernetes adds more pods. When traffic drops, it removes them.
#
#    Prerequisites:
#      • Metrics Server must be installed in the cluster
#      • Pods must have resource requests defined (see Deployment above)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: product-service-hpa
  namespace: modern-web-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: product-service     # Scale this deployment

  minReplicas: 2              # Never scale below 2 (high availability)
  maxReplicas: 10             # Never scale above 10 (cost control)

  metrics:
    # Scale up when average CPU usage across all pods exceeds 70%
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    # Also scale based on memory
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# ─────────────────────────────────────────────────────────────────────────────
# 8. SERVICE ACCOUNT
#
#    A Kubernetes identity for pods to interact with Azure services
#    using Workload Identity (no passwords needed).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: product-service-sa
  namespace: modern-web-app
  annotations:
    # Workload Identity: link this K8s service account to an Azure Managed Identity
    # The pod can then access Azure Key Vault, Azure SQL, etc. without any secrets
    azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000000"
  labels:
    azure.workload.identity/use: "true"
